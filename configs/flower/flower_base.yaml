# 多模型实验的公共配置：日常切换网络无需修改本文件。
# 子配置使用 defaults: [flower_base, _self_]，只填写模型及需要覆盖的参数。
# 当前公共数据集为 flower_photos；所有路径相对于最终传给 -Config 的 YAML 目录。
# 将模型配置放在本目录，保持 ../../data、../../weights、../../runs 的含义一致。
# 本文件是模板，不单独训练：experiment.name、model.provider/name 必须由子配置提供。
schema_version: 1

experiment:
  name: null  # 子配置必填，结果写入 runs/<name>/<run_id>，每次运行独立保存。
  seed: 42  # 控制初始化、打乱与增强；不会重新划分已有 train/val/test 目录。
  output_root: ../../runs

task:
  type: multiclass  # 单标签多分类；改变任务时还需配套修改损失和评估设置。

# 固定划分：train=2564、val=551、test=551。多模型共用，便于公平比较。
# 若某次实验更换数据集，在其子配置中覆盖 dataset，无需修改公共基线。
dataset:
  provider: imagefolder  # 直接扫描 train/val/test/<类别>/图片，不依赖 CSV 清单。
  name: flower_photos  # 五类花卉，不是 Flowers102。
  root: ../../data/flower_photos_split
  manifest: null  # ImageFolder 不读取 samples.csv；处理脚本生成的清单仅用于追溯。
  classes_file: null  # 从 train 子目录按名称排序：daisy/dandelion/roses/sunflowers/tulips。
  splits: {train: train, val: val, test: test}  # 数据集根目录下的三个划分目录。
  num_classes: 5
  integrity: strict  # 解码并计算文件 SHA256，检查跨集合重复；此模式没有 manifest group_id。
  limit_per_split: null  # 使用全部样本；整数仅用于短流程检查。

model:
  provider: null  # 子配置必填：torchvision 或 timm；二者模型命名不同。
  name: null  # 子配置必填：具体网络名称。
  num_classes: auto  # 准备数据后从类别表推断输出数，自动适配预训练模型的分类头。
  training_mode: full_finetune  # 全参数微调；linear_probe 则只训练分类头。
  weights:
    source: provider_default  # 默认加载发布方预训练主干，新分类头需要训练。
    # 优先复用 weights/ 缓存，缺失时自动下载；失败直接报错，不回退到随机主干。

preprocessing:
  source: model_weights  # 自动采用所选权重的归一化、插值、裁剪与缩放参数。
  image_size: auto  # 自动使用权重输入尺寸，无需针对各模型手动填写。
  color_mode: RGB
  # 以下为公共初值；model_weights 会使用权重提供的实际预处理参数。
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  interpolation: bilinear
  crop_pct: 0.875

augmentation:
  preset: baseline  # 训练随机裁剪缩放及水平翻转；验证/测试使用确定性转换。
  # none 关闭随机增强；strong 额外使用 RandAugment 和 RandomErasing。

loader:
  batch_size_per_device: 4  # 适合当前 CPU 多模型测试；单模型可覆盖。
  num_workers: 0  # 本机多 worker 曾耗尽内存；不要直接照搬 Lightning 建议的 27。
  # 多 worker 时训练和验证可分别创建持久进程，峰值可能为 2×num_workers。

loss:
  name: cross_entropy  # 接收原始 logits，适用于当前单标签多分类。

optimizer:
  name: adamw  # 另支持 adam、sgd。
  lr: 0.0003
  weight_decay: 0.01  # 默认排除偏置和一维/标量参数。

scheduler:
  name: warmup_cosine  # 按优化器更新步数：线性预热后余弦衰减。
  warmup_epochs: 1  # 必须小于 trainer.max_epochs。
  min_lr: 0.000001  # 不能高于 optimizer.lr。

trainer:
  max_epochs: 10  # 实验起点，尚未验证所有模型在此预算下收敛。
  accelerator: cpu  # 当前锁定环境是 CPU 版；GPU 需先配置并验收 CUDA 环境。
  precision: 32-true
  deterministic: true  # 不保证跨硬件或依赖版本完全一致。
  enable_progress_bar: true

evaluation:
  monitor: val/macro_f1  # 默认取最大值选最佳 checkpoint；测试集留作最终独立评估。
  # 五分类的 Top-5 恒为 100%，比较模型时关注 Top-1、Macro-F1 和逐类指标。

logging:
  level: INFO  # DEBUG / INFO / WARNING / ERROR。
  console: true  # 关键步骤写入终端 stderr，不混入 CLI 的 JSON 结果。
  file: true  # 每次操作写独立的 UTF-8 日志，记录耗时和异常堆栈。
  directory: ../../logs  # 项目根目录 logs/，路径相对于 configs/flower/ 中的模型 YAML。
  tensorboard: false  # 原有可选 TensorBoard 指标记录，需 tracking 依赖。

checkpoint:
  finetune_from: last  # 同一实验自动选择最新 last.ckpt；不存在时使用上面的初始权重。
  # 仅继承模型参数，新建运行目录，epoch/学习率/优化器按本次配置重新开始。
  # 使用 --fresh 或设为 null 可关闭；完整断点恢复仍使用 --resume。

visualization:
  enabled: true  # 训练后生成曲线、逐类指标、混淆矩阵和离线 HTML 报告。
  top_k: 5  # 保存预测图片时显示的最高概率类别数。
  max_images: 64  # 预测报告最多展示的图片数；JSONL 仍保存全部预测。

runtime:
  offline: false  # 允许下载缺失权重；true 时缺缓存直接报错。
  cache_dir: ../../cache  # 数据准备记录等缓存。
  weights_dir: ../../weights  # 原始预训练权重及适配分类头后的初始化权重。
