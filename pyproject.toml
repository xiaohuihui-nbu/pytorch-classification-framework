[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xhh-classification"
version = "0.1.0"
description = "Configuration-driven PyTorch image classification framework"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0.20,<2",
  "lightning>=2.5,<3", "torchmetrics>=1.6,<2", "hydra-core>=1.3,<2",
  "pydantic>=2.10,<3", "typer>=0.15,<1", "pillow>=10",
  "numpy>=1.26", "scikit-learn>=1.5", "safetensors>=0.5", "pyyaml>=6", "filelock>=3", "tqdm>=4.66,<5"
]

[project.optional-dependencies]
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.3"]
tracking = ["tensorboard>=2.18", "mlflow>=2.20"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
cls = "clsframework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clsframework"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
